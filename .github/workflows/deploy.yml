name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deployment is done manually via the ai-builders.space portal.
# This workflow only runs the typecheck to catch type errors on every push.

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm --workspace @vecstack/shared run build
      - run: npm run typecheck
